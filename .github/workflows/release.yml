name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y nsis gcc-mingw-w64-x86-64
      - run: node desktop/checkjs.mjs
      - run: desktop/build.sh
      - id: ver
        run: echo "v=$(node -p "require('./desktop/neutralino.config.json').version")" >> "$GITHUB_OUTPUT"
      - name: SHA-256 of the installer (the in-app updater refuses a download that does not match)
        run: cd desktop/out && for f in smartPDF-Setup-*.exe; do sha256sum "$f" > "$f.sha256"; cat "$f.sha256"; done
      - name: Release notes from the app's changelog
        run: node desktop/notes.mjs > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: smartPDF-Setup
          path: desktop/out/smartPDF-Setup-*.exe
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: smartPDF ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            desktop/out/smartPDF-Setup-*.exe
            desktop/out/smartPDF-Setup-*.exe.sha256
  android-apk:
    needs: windows-installer
    uses: ./.github/workflows/android.yml
    secrets: inherit
