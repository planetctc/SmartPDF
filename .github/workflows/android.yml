name: Android APK
# Builds the Android app (smartpdf.html wrapped with Capacitor) and attaches the APK to the release.
on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths: ['mobile/**', 'smartpdf.html', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: node desktop/checkjs.mjs
      - name: Install Capacitor
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        working-directory: mobile
        run: |
          node prepare.mjs www
          npx cap add android
          node prepare.mjs android
          npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --splashBackgroundColor '#12307a' || echo "icon generation skipped"
          npx cap sync android
      - name: Build
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleRelease
      - id: ver
        run: echo "v=$(node -p "require('./desktop/neutralino.config.json').version")" >> "$GITHUB_OUTPUT"
      - name: Sign
        # Uses the private release key when the repo secrets ANDROID_KEYSTORE_B64 / ANDROID_KEY_ALIAS / ANDROID_KEY_PASS are set;
        # until then the public test key in mobile/ (changing key = existing installs must uninstall once).
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=smartPDF-${{ steps.ver.outputs.v }}.apk
          "$BT/zipalign" -f -p 4 "$IN" aligned.apk
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            KS="$RUNNER_TEMP/release.keystore"; ALIAS="$KS_ALIAS"; export PASS="$KS_PASS"; echo "signing with the release key"
          else
            KS=mobile/smartpdf-test.keystore; ALIAS=smartpdf; export PASS=smartpdf-test; echo "::warning::signing with the public TEST key"
          fi
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass env:PASS --key-pass env:PASS --out "$OUT" aligned.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          "$BT/apksigner" verify "$OUT"
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: smartPDF-android
          path: smartPDF-*.apk
      - if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          files: smartPDF-*.apk
